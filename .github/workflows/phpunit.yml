name: PHPUnit

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  phpunit:
    needs: actionlint
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: wordpress_test
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2
          extensions: mysqli

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install WP-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

      - name: Prepare WordPress test environment
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: bash bin/install-wp-tests.sh

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Analyze PHP
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Build block assets
        run: |
          npm ci
          npm run build
          npm run test:package
