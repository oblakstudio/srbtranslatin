name: Build and release
on:
  push:
    branches:
      - master

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  release:
    needs: actionlint
    name: Release next version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.OBLAK_BOT_TOKEN }}
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader --classmap-authoritative --prefer-dist
      - name: Install NPM deps
        run: npm ci
      - name: Build block assets
        run: npm run build
      - name: Release
        env:
          GIT_AUTHOR_NAME: "oblakbot"
          GIT_AUTHOR_EMAIL: "sibin.grasic+bot@oblak.studio"
          GIT_COMMITTER_NAME: "oblakbot"
          GIT_COMMITTER_EMAIL: "sibin.grasic+bot@oblak.studio"
          GITHUB_TOKEN: ${{ secrets.OBLAK_BOT_TOKEN }}
        run: npm run semantic-release
      - name: Setup deploy variables
        id: wpvar
        shell: bash
        run: |
          sh .github/scripts/set-version.sh
      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WP_ORG_SVN_USER }}
          SVN_PASSWORD: ${{ secrets.WP_ORG_SVN_PASS }}
          ASSETS_DIR: ".wordpress-org/assets"
          SLUG: "srbtranslatin"
          VERSION: ${{ steps.wpvar.outputs.version }}
        with:
          generate-zip: false
